<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Tài Liệu HSK 1 - Đồng Bộ GitHub Cloud</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-8">
        <h1 class="text-3xl font-bold text-slate-800 mb-2 text-center">📁 Kho Tài Liệu HSK 1 (Cloud Hub)</h1>
        <p class="text-slate-500 text-center mb-6">Trang quản lý tài liệu đồng bộ trực tiếp qua GitHub</p>

        <!-- Khung Upload Dành Cho Thầy -->
        <div class="bg-indigo-50 border-2 border-dashed border-indigo-300 rounded-2xl p-6 mb-8 text-center">
            <h2 class="text-lg font-semibold text-indigo-900 mb-2">📤 Tải lên tài liệu mới lên GitHub</h2>
            <p class="text-xs text-indigo-600 mb-4">File tải lên sẽ được lưu trực tiếp vào kho chung của hệ thống</p>
            
            <input type="file" id="file-upload" accept=".html,.htm" class="hidden" onchange="uploadToGitHub(event)">
            <label for="file-upload" class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-6 rounded-xl transition inline-block shadow-sm">
                Chọn file từ máy tính và Tải lên
            </label>
        </div>

        <!-- Trạng thái -->
        <div id="status-msg" class="text-center text-sm font-medium mb-4 text-indigo-600 p-2 rounded-lg bg-indigo-50/50"></div>

        <!-- Danh sách tài liệu -->
        <h2 class="text-xl font-bold text-slate-800 mb-4">📚 Danh sách bài học chung</h2>
        <div class="space-y-3" id="file-list-container">
            <p class="text-center text-slate-400 py-4">Đang tải danh sách tài liệu...</p>
        </div>
    </div>

    <script>
        const GITHUB_USER = "20230711-alt"; 
        const REPO_NAME = "kho-tai-lieu-hsk1"; 
        const GITHUB_TOKEN = "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"; // Token của bạn

        let remoteFiles = [];

        // 1. Tải danh sách file từ GitHub về (Bổ sung bộ lọc không phân biệt hoa/thường)
        async function fetchGitHubFiles() {
            const statusEl = document.getElementById('status-msg');
            statusEl.textContent = "⏳ Đang đồng bộ danh sách từ GitHub...";

            try {
                let response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/`, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                
                if (!response.ok) throw new Error("Không thể kết nối đến kho GitHub");

                let data = await response.json();
                
                if (Array.isArray(data)) {
                    // Lọc lấy tất cả các file có đuôi .html hoặc .htm (bất kể chữ hoa hay chữ thường, bỏ qua README.md)
                    remoteFiles = data.filter(item => {
                        if (item.type !== 'file') return false;
                        const lowerName = item.name.toLowerCase();
                        return (lowerName.endsWith('.html') || lowerName.endsWith('.htm')) && lowerName !== 'readme.md';
                    });
                } else {
                    remoteFiles = [];
                }

                renderList();
                statusEl.textContent = "✅ Đã đồng bộ thành công với GitHub!";
            } catch (err) {
                console.error(err);
                statusEl.textContent = "⚠️ Lỗi kết nối GitHub.";
                remoteFiles = [];
                renderList();
            }
        }

        // Hiển thị danh sách ra giao diện
        function renderList() {
            const container = document.getElementById('file-list-container');
            if (remoteFiles.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-4">Chưa có file bài học nào trên hệ thống.</p>`;
                return;
            }

            container.innerHTML = remoteFiles.map((file) => `
                <div class="flex items-center justify-between p-4 bg-slate-50 border border-slate-200 rounded-xl hover:border-indigo-400 transition">
                    <div class="flex items-center space-x-3">
                        <span class="text-2xl">📄</span>
                        <div>
                            <h3 class="font-bold text-slate-800">${file.name}</h3>
                            <p class="text-xs text-slate-400">Dung lượng: ${(file.size / 1024).toFixed(1)} KB</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <a href="${file.html_url}" target="_blank" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-1.5 px-4 rounded-lg transition inline-block text-center">
                            Học ngay
                        </a>
                        <button onclick="deleteFromGitHub('${file.name}', '${file.sha}')" class="text-red-500 hover:bg-red-50 p-2 rounded-lg transition cursor-pointer" title="Xóa file">
                            🗑️
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 2. Tải file mới lên GitHub qua API
        function uploadToGitHub(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('status-msg');
            statusEl.textContent = "⏳ Đang đẩy file lên GitHub...";

            const reader = new FileReader();
            reader.readAsDataURL(file);

            reader.onload = async function(e) {
                const base64Content = e.target.result.split(',')[1];
                const filePath = file.name;

                try {
                    let response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${filePath}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${GITHUB_TOKEN}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: `Upload ${file.name} qua trang quản lý`,
                            content: base64Content
                        })
                    });

                    if (!response.ok) {
                        let errData = await response.json();
                        throw new Error(errData.message || "Lỗi khi tải file lên GitHub");
                    }

                    statusEl.textContent = `🎉 Tải lên thành công file "${file.name}" trực tiếp lên kho GitHub!`;
                    fetchGitHubFiles(); // Tải lại danh sách để hiển thị ngay lập tức
                } catch (err) {
                    console.error(err);
                    statusEl.textContent = `❌ Lỗi tải lên: ${err.message}`;
                }
            };
        }

        // 3. Xóa file trên GitHub
        async function deleteFromGitHub(fileName, fileSha) {
            if (confirm(`Bạn có chắc chắn muốn xóa file ${fileName} khỏi hệ thống không?`)) {
                const statusEl = document.getElementById('status-msg');
                statusEl.textContent = `⏳ Đang xóa file ${fileName}...`;

                try {
                    let response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${fileName}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `token ${GITHUB_TOKEN}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: `Xóa file ${fileName}`,
                            sha: fileSha
                        })
                    });

                    if (!response.ok) throw new Error("Không thể xóa file");

                    statusEl.textContent = `✅ Đã xóa thành công file ${fileName}!`;
                    fetchGitHubFiles();
                } catch (err) {
                    statusEl.textContent = "❌ Lỗi khi xóa file!";
                }
            }
        }

        // Khởi chạy khi mở trang
        fetchGitHubFiles();
    </script>
</body>
</html>
